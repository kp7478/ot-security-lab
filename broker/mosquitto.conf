# TLS-only listener on localhost
listener 8883 localhost

# Trust anchor used to verify client certs
cafile pki/root_ca.crt

# Broker identity (cert name = localhost)
certfile broker/broker.crt
keyfile broker/broker.key

# Mutual TLS: every client must present a cert from our CA
require_certificate true

# Client identity comes from the cert's name, not a password
use_identity_as_username true

tls_version tlsv1.2
log_dest stdout
log_type all
acl_file broker/acl
